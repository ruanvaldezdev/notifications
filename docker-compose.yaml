services:
  postgres:
    container_name: postgres
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notification
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3.10-management
    hostname: meu-rabbit
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./dados:/var/lib/rabbitmq/
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  eureka-server:
    build: ./server
    ports:
      - "8081:8081"
    environment:
      - EUREKA_SERVER_HOST=eureka-server
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8081' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  gateway:
    build: ./gateway
    ports:
      - "8082:8082"
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      - EUREKA_SERVER_HOST=eureka-server
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8082' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api-service:
    build: ./api
    ports:
      - "8083:8083"
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL_HOST=postgres
      - SPRING_RABBITMQ_HOST=rabbitmq
      - EUREKA_SERVER_HOST=eureka-server
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8083' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  sms-service:
    build: ./sms
    ports:
      - "8085:8085"
    depends_on:
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      - EUREKA_SERVER_HOST=eureka-server
      - SPRING_RABBITMQ_HOST=rabbitmq
      - TWILIO_ACCOUNT_SID=${TWILIO_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_TOKEN}
      - NUMBER_SMS=${NUMBER_SMS}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8085' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  email-service:
    build: ./email
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL_HOST=postgres
      - SPRING_RABBITMQ_HOST=rabbitmq
      - EUREKA_SERVER_HOST=eureka-server
      - API_TOKEN_EMAIL=${API_TOKEN_EMAIL}
      - API_DOMAIN=${API_DOMAIN}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8084' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
